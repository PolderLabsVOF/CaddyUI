name: Verify

on:
  pull_request:
    branches: [dev, beta, main]
  push:
    branches: [dev, beta, main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Enforce release-channel versioning
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            case "$TARGET_BRANCH" in
              dev)
                [[ "$SOURCE_BRANCH" != "dev" && "$SOURCE_BRANCH" != "beta" && "$SOURCE_BRANCH" != "main" ]] || { echo "Only short-lived feature/fix branches may target dev."; exit 1; }
                ;;
              beta)
                [[ "$SOURCE_BRANCH" == "dev" ]] || { echo "Only dev may be promoted to beta."; exit 1; }
                ;;
              main)
                [[ "$SOURCE_BRANCH" == "beta" ]] || { echo "Only beta may be promoted to main."; exit 1; }
                ;;
            esac
          fi
          version="$(node -p "require('./package.json').version")"
          case "$TARGET_BRANCH" in
            main) [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "main releases must use a stable x.y.z version; found $version"; exit 1; } ;;
            beta) [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta$ ]] || { echo "beta releases must use x.y.z-beta; found $version"; exit 1; } ;;
          esac
      - name: Type check
        run: npm run typecheck
      - name: Build production bundle
        run: npm run build
      - name: Validate installer shell syntax
        run: bash -n scripts/install.sh
      - name: Ensure clean generated output
        run: git diff --exit-code
